<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
	<defs>
		<g id="link-a">
			<rect x="8" y="35" width="50" height="30" rx="15" fill="none" stroke="#2a2238" stroke-width="18"/>
			<rect x="8" y="35" width="50" height="30" rx="15" fill="none" stroke="#3d8bff" stroke-width="12"/>
		</g>
		<clipPath id="link-top">
			<rect x="0" y="0" width="100" height="50"/>
		</clipPath>
	</defs>
	<g transform="rotate(-45 50 50)">
		<use href="#link-a" xlink:href="#link-a"/>
		<rect x="42" y="35" width="50" height="30" rx="15" fill="none" stroke="#2a2238" stroke-width="18"/>
		<rect x="42" y="35" width="50" height="30" rx="15" fill="none" stroke="#9b5cff" stroke-width="12"/>
		<!-- redraw blue link on top for the upper crossing only, so the loops interlock -->
		<use href="#link-a" xlink:href="#link-a" clip-path="url(#link-top)"/>
	</g>
</svg>
