# nginx site for Kuzix: copy to /etc/nginx/sites-available/, replace server_name and the root path,
# then add TLS (certbot --nginx). Static files are served by nginx, /api and /ws go to Node on :3000.
server {
	listen 80;
	server_name kuzix.example.com;
	root /home/deploy/kuzix/front/dist;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location / {
		try_files $uri /index.html;
	}

	location /api/ {
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /ws {
		proxy_pass http://127.0.0.1:3000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 1h;
	}
}
